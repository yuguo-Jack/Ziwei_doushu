version: 2
# Pause routine version PRs; security updates have a separate GitHub limit.
# Upgrade the verified dependency set together; see docs/DEPENDENCIES.zh-CN.md.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
